<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sint-planner - FC Berghuizen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #991b1b;
    --primary-dark: #7f1d1d;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --accent: #059669;
    --whatsapp: #25d366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px 18px; font-size: 0.86rem; }

  /* Compact Header */
  header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); padding: 10px 16px; border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid var(--border);
  }
  .app-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .header-nav { display: flex; gap: 6px; align-items: center; }

  /* Buttons - compact */
  .btn {
    padding: 5px 11px; border-radius: 5px; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: white; color: var(--text);
    display: inline-flex; align-items: center; gap: 4px; text-decoration: none; transition: all 0.15s;
  }
  .btn:hover { background: #f1f5f9; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-active { border-color: #ef4444; color: #b91c1c; background: #fef2f2; }
  .btn-sm { padding: 3px 7px; font-size: 0.74rem; }
  .btn-whatsapp { background: #25d366; color: white; border-color: #128c7e; font-weight: bold; }
  .btn-whatsapp:hover { background: #128c7e; color: white; }

  /* Top actions */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* Day heading */
  .day-title { font-size: 1rem; font-weight: 800; color: #1e3a8a; margin: 16px 0 8px 0; display: flex; align-items: center; gap: 6px; }

  /* Compact Cards */
  .routes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .route-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); transition: border-color 0.2s;
  }
  .route-card:hover { border-color: #cbd5e1; }
  .route-card.is-open { border-left: 3px solid #ef4444; }
  .route-card.is-complete { border-left: 3px solid #10b981; }

  .route-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .route-main-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  
  /* Route nummer badge */
  .route-nr-badge {
    background: #1e3a8a; color: white; font-weight: 800; font-size: 0.76rem;
    padding: 2px 6px; border-radius: 4px; letter-spacing: 0.3px;
  }
  .route-name { font-weight: 800; font-size: 0.95rem; color: #0f172a; }
  .route-place { color: #64748b; font-weight: 500; font-size: 0.82rem; }
  .route-times { font-size: 0.78rem; color: #1e40af; font-weight: 700; background: #eff6ff; padding: 2px 6px; border-radius: 3px; }

  .status-badge {
    font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; border: 1px solid transparent;
  }
  .badge-complete { border-color: #10b981; color: #065f46; background: #ecfdf5; }
  .badge-open { border-color: #ef4444; color: #991b1b; background: #fef2f2; }

  .route-subline { font-size: 0.75rem; color: #64748b; margin-bottom: 6px; line-height: 1.3; }
  .route-notes { font-size: 0.74rem; color: #92400e; background: #fffbeb; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; display: inline-block; }

  /* Slots List (S, C1, P1, P2...) - compact */
  .slots-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .slot-row { display: flex; align-items: center; gap: 6px; }
  .slot-role {
    width: 26px; font-weight: 800; font-size: 0.75rem; text-align: center;
    padding: 2px 0; border-radius: 3px; background: #f1f5f9; color: #475569;
  }
  .slot-role.role-s { background: #fee2e2; color: #991b1b; }
  .slot-role.role-c { background: #dbeafe; color: #1e40af; }
  .slot-role.role-p { background: #fef3c7; color: #92400e; }

  select.slot-select {
    flex: 1; padding: 3px 6px; font-size: 0.8rem; font-weight: 500;
    border: 1px solid var(--border); border-radius: 4px; background: white; color: #1e293b;
  }
  select.slot-select:focus { outline: 2px solid #93c5fd; }
  select.slot-select.unassigned { border-color: #fca5a5; background: #fff5f5; color: #991b1b; font-weight: bold; }

  .btn-remove-slot { background: transparent; border: none; color: #94a3b8; font-size: 0.85rem; cursor: pointer; padding: 0 4px; }
  .btn-remove-slot:hover { color: #dc2626; }

  .slots-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border); }
  .add-slot-btns { display: flex; gap: 4px; }

  /* Edit Accordion */
  .edit-toggle { font-size: 0.74rem; color: #2563eb; cursor: pointer; user-select: none; font-weight: 600; }
  .edit-toggle:hover { text-decoration: underline; }
  .edit-form-panel {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 10px; margin-top: 6px; display: none;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 5px; }
  .form-col label { display: block; font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 2px; }
  .form-col input { width: 100%; padding: 4px 6px; font-size: 0.78rem; border: 1px solid var(--border); border-radius: 3px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal-box { background: white; padding: 18px; border-radius: 8px; width: 92%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
</style>
</head>
<body>

<header class="no-print">
  <div class="app-title">馃巺 Sint-planner FC Berghuizen</div>
  <div class="header-nav">
    <button class="btn btn-active" onclick="switchView('routes')">Routes</button>
    <button class="btn" onclick="switchView('personen')">Personen</button>
    <button class="btn" onclick="switchView('chauffeurs')">馃殫 Chauffeurs Overzicht</button>
    <button class="btn btn-outline" id="btnAuth" onclick="handleAuth()">Uitloggen</button>
  </div>
</header>

<!-- TOP CONTROLS -->
<div class="top-bar no-print">
  <div class="filter-group">
    <button class="btn" id="btnFilterOpen" onclick="toggleFilterOpen()">Alleen routes met open plekken</button>
    <button class="btn btn-primary" onclick="openNewRouteModal()">+ Route</button>
  </div>
  <div style="font-size: 0.8rem; color: #64748b;" id="routesCountLabel">Laden...</div>
</div>

<!-- MAIN VIEW: ROUTES -->
<main id="viewRoutes"></main>

<!-- VIEW: PERSONEN BEHEER -->
<main id="viewPersonen" style="display:none;">
  <div style="max-width: 800px; margin: 0 auto; background: white; padding: 18px; border-radius: 8px; border: 1px solid var(--border);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="font-size: 1.1rem; color: var(--primary);">Personen & Vrijwilligers</h3>
      <button class="btn btn-primary btn-sm" onclick="promptAddPerson()">+ Nieuwe Persoon</button>
    </div>
    <table style="width:100%; border-collapse:collapse; font-size:0.82rem;" id="personenTable">
      <thead>
        <tr style="background:#f1f5f9; text-align:left;">
          <th style="padding:6px;">Naam</th>
          <th style="padding:6px;">Rol</th>
          <th style="padding:6px;">Telefoon</th>
          <th style="padding:6px;">Notitie</th>
          <th style="padding:6px; text-align:center;">Actie</th>
        </tr>
      </thead>
      <tbody id="personenTableBody"></tbody>
    </table>
  </div>
</main>

<!-- VIEW: CHAUFFEURS WEERGAVE & WHATSAPP -->
<main id="viewChauffeurs" style="display:none;">
  <div id="chauffeursContainer" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:12px;"></div>
</main>

<!-- MODAL: NIEUWE ROUTE -->
<div class="modal-overlay" id="newRouteModal">
  <div class="modal-box">
    <h3 style="color:var(--primary); margin-bottom:10px; font-size:1.05rem;">+ Nieuwe Route Toevoegen</h3>
    <div class="form-row">
      <div class="form-col">
        <label>Route Nummer (#):</label>
        <input type="text" id="newRouteNr" placeholder="bijv. 1 of 2b">
      </div>
      <div class="form-col">
        <label>Dag:</label>
        <input type="text" id="newRouteDay" placeholder="bijv. Zaterdag 21 november">
      </div>
    </div>
    <div class="form-row">
      <div class="form-col">
        <label>Naam / Locatie / Bedrijf:</label>
        <input type="text" id="newRouteName" placeholder="bijv. Judo Losser">
      </div>
      <div class="form-col">
        <label>Plaats / Wijk:</label>
        <input type="text" id="newRoutePlaats" placeholder="bijv. Losser">
      </div>
    </div>
    <div class="form-row">
      <div class="form-col">
        <label>Vertrektijd:</label>
        <input type="text" id="newRouteVertrek" placeholder="09:10">
      </div>
      <div class="form-col">
        <label>Terugkomsttijd:</label>
        <input type="text" id="newRouteTerug" placeholder="11:20">
      </div>
    </div>
    <div class="form-row">
      <div class="form-col">
        <label>Aanwezig (P 路 S 路 C):</label>
        <input type="text" id="newRouteAanwezig" placeholder="P 08:25 路 S 08:40 路 C 08:55">
      </div>
      <div class="form-col">
        <label>Opmerkingen:</label>
        <input type="text" id="newRouteNotes" placeholder="bijv. incl. schminken">
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:12px;">
      <button class="btn" onclick="closeNewRouteModal()">Annuleren</button>
      <button class="btn btn-primary" onclick="saveNewRoute()">Opslaan</button>
    </div>
  </div>
</div>

<script>
// --- SUPABASE CONFIG ---
const SUPABASE_URL = "https://ovqjojgztbbyrkgrfzxc.supabase.co";
const SUPABASE_KEY = "sb_publishable_RnRgJJAyxebE1nYhDUsIRQ_sG9FgtzT";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  routes: [],
  personen: [],
  filterOpenOnly: false,
  currentView: 'routes',
  user: null
};

// Vaste standaardopties
const SPECIAL_OPTIONS = ["eigen", "zelf", "n.v.t."];

// Initialiseer app
async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.user = session ? session.user : null;
  updateAuthBtn();

  await loadData();
}

function updateAuthBtn() {
  const btn = document.getElementById("btnAuth");
  if (state.user) {
    btn.innerText = `Uitloggen (${state.user.email})`;
  } else {
    btn.innerText = "Inloggen";
  }
}

async function handleAuth() {
  if (state.user) {
    await supabaseClient.auth.signOut();
    state.user = null;
    updateAuthBtn();
    alert("Uitgelogd.");
  } else {
    const email = prompt("Voer je e-mailadres in:");
    if (!email) return;
    const password = prompt("Voer je wachtwoord in:");
    if (!password) return;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) alert("Fout bij inloggen: " + error.message);
    else {
      state.user = data.user;
      updateAuthBtn();
      alert("Succesvol ingelogd als planner!");
    }
  }
}

// Data ophalen uit Supabase
async function loadData() {
  try {
    // Haal personen op
    const { data: persData } = await supabaseClient.from('personen').select('*').order('naam');
    if (persData) state.personen = persData;

    // Haal routes op met plekken
    const { data: rData, error } = await supabaseClient.from('routes').select('*, plekken(*)').order('id');
    if (rData && !error) {
      state.routes = rData;
    }
  } catch (err) {
    console.error("Fout bij ophalen Supabase:", err);
  }

  // Fallback naar lokale data als Supabase nog leeg is
  if (state.routes.length === 0) {
    // Lokale default data activeren
    loadFallbackData();
  }

  render();
}

function render() {
  if (state.currentView === 'routes') renderRoutes();
  else if (state.currentView === 'personen') renderPersonen();
  else if (state.currentView === 'chauffeurs') renderChauffeurs();
}

function switchView(viewName) {
  state.currentView = viewName;
  document.getElementById("viewRoutes").style.display = viewName === 'routes' ? 'block' : 'none';
  document.getElementById("viewPersonen").style.display = viewName === 'personen' ? 'block' : 'none';
  document.getElementById("viewChauffeurs").style.display = viewName === 'chauffeurs' ? 'block' : 'none';

  document.querySelectorAll(".header-nav .btn").forEach(b => b.classList.remove("btn-active"));
  if (event && event.target) event.target.classList.add("btn-active");
  render();
}

function toggleFilterOpen() {
  state.filterOpenOnly = !state.filterOpenOnly;
  const btn = document.getElementById("btnFilterOpen");
  btn.classList.toggle("btn-active", state.filterOpenOnly);
  renderRoutes();
}

// Check of een route nog open plekken heeft
function isRouteOpen(r) {
  if (!r.plekken || r.plekken.length === 0) return false;
  return r.plekken.some(p => !p.persoon_id && !p.status && !p.naam);
}

// --- RENDER ROUTES (COMPACT + ROUTENUMMERS + NAAM/TIJDEN AANPASSEN) ---
function renderRoutes() {
  const container = document.getElementById("viewRoutes");
  let filtered = state.routes;

  if (state.filterOpenOnly) {
    filtered = filtered.filter(r => isRouteOpen(r));
  }

  document.getElementById("routesCountLabel").innerText = `${filtered.length} route(s) getoond`;

  // Groepeer per dag
  const byDay = {};
  filtered.forEach((r, idx) => {
    const day = r.datum || r.day || "Onbekende datum";
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push({ ...r, origIndex: idx });
  });

  let html = "";
  Object.keys(byDay).forEach(day => {
    const list = byDay[day];
    html += `<div class="day-title">馃搮 ${day} <span style="font-size:0.75rem; font-weight:normal; color:#64748b;">(${list.length} ritten)</span></div>`;
    html += `<div class="routes-grid">`;

    list.forEach(r => {
      const open = isRouteOpen(r);
      const nrDisplay = r.nr ? `#${r.nr}` : (r.id ? `#${r.id}` : '#');
      const vertrekTerug = (r.vertrek || r.terug) ? `vertrek: ${r.vertrek || '?'} 路 terug: ${r.terug || '?'}` : '';

      html += `
        <div class="route-card ${open ? 'is-open' : 'is-complete'}" id="route-card-${r.id}">
          <div class="route-header">
            <div class="route-main-info">
              <span class="route-nr-badge" title="Routenummer">${nrDisplay}</span>
              <span class="route-name" id="name-display-${r.id}">${r.naam || r.locatie || 'Naamloze route'}</span>
              <span class="route-place">${r.plaats ? `(${r.plaats})` : ''}</span>
              ${vertrekTerug ? `<span class="route-times">${vertrekTerug}</span>` : ''}
            </div>
            <div>
              <span class="status-badge ${open ? 'badge-open' : 'badge-complete'}">
                ${open ? 'open plekken' : 'compleet'}
              </span>
            </div>
          </div>

          ${r.aanwezig ? `<div class="route-subline">鈴?Aanwezig: <strong>${r.aanwezig}</strong></div>` : ''}
          ${r.opmerkingen ? `<div class="route-notes">鈩癸笍 ${r.opmerkingen}</div>` : ''}

          <!-- PLEKKEN / ROLLEN (S, C1, P1...) -->
          <div class="slots-list" id="slots-wrap-${r.id}">
            ${renderSlotsForRoute(r)}
          </div>

          <div class="slots-actions no-print">
            <div class="add-slot-btns">
              <button class="btn btn-sm" onclick="addSlotToRoute('${r.id}', 'S')">+ S</button>
              <button class="btn btn-sm" onclick="addSlotToRoute('${r.id}', 'C')">+ C</button>
              <button class="btn btn-sm" onclick="addSlotToRoute('${r.id}', 'P')">+ P</button>
            </div>
            <span class="edit-toggle" onclick="toggleEditPanel('${r.id}')">鉁忥笍 Route & Tijden bewerken 鈻?/span>
          </div>

          <!-- BEWERKINGS PANEEL VOOR ROUTENAAM & TIJDEN -->
          <div class="edit-form-panel no-print" id="edit-panel-${r.id}">
            <div class="form-row">
              <div class="form-col" style="flex: 0 0 80px;">
                <label>Route Nr:</label>
                <input type="text" id="edit-nr-${r.id}" value="${r.nr || ''}" placeholder="1">
              </div>
              <div class="form-col">
                <label>Routenaam / Locatie:</label>
                <input type="text" id="edit-name-${r.id}" value="${r.naam || r.locatie || ''}">
              </div>
            </div>
            <div class="form-row">
              <div class="form-col">
                <label>Plaats / Wijk:</label>
                <input type="text" id="edit-plaats-${r.id}" value="${r.plaats || ''}">
              </div>
              <div class="form-col">
                <label>Vertrektijd:</label>
                <input type="text" id="edit-vertrek-${r.id}" value="${r.vertrek || ''}">
              </div>
            </div>
            <div class="form-row">
              <div class="form-col">
                <label>Terugkomsttijd:</label>
                <input type="text" id="edit-terug-${r.id}" value="${r.terug || ''}">
              </div>
              <div class="form-col">
                <label>Aanwezig (P 路 S 路 C):</label>
                <input type="text" id="edit-aanwezig-${r.id}" value="${r.aanwezig || ''}">
              </div>
            </div>
            <div style="margin-bottom: 5px;">
              <label style="font-size: 0.7rem; font-weight: bold; color: #475569;">Opmerkingen:</label>
              <input type="text" id="edit-notes-${r.id}" value="${r.opmerkingen || ''}" style="width:100%; padding:3px 6px; font-size:0.76rem; border:1px solid var(--border); border-radius:3px;">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
              <button class="btn btn-sm" style="color:#dc2626;" onclick="deleteRoute('${r.id}')">馃棏锔?Verwijder route</button>
              <button class="btn btn-primary btn-sm" onclick="saveRouteEdits('${r.id}')">馃捑 Opslaan</button>
            </div>
          </div>

        </div>
      `;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

// Render slots / plekken per route
function renderSlotsForRoute(r) {
  if (!r.plekken || r.plekken.length === 0) {
    return `<div style="font-size:0.75rem; color:#94a3b8; font-style:italic;">Geen plekken aangemaakt. Klik hieronder op +S, +C of +P.</div>`;
  }

  let html = "";
  r.plekken.forEach(p => {
    const label = p.rol_label || p.rol || 'Rol';
    const isS = label.startsWith('S');
    const isC = label.startsWith('C');
    const isP = label.startsWith('P');
    const roleClass = isS ? 'role-s' : (isC ? 'role-c' : 'role-p');

    // Valuta
    const assignedVal = p.persoon_id || p.status || p.naam || "";
    const isUnassigned = !assignedVal;

    html += `
      <div class="slot-row">
        <span class="slot-role ${roleClass}">${label}</span>
        <select class="slot-select ${isUnassigned ? 'unassigned' : ''}" onchange="assignPersonToSlot('${r.id}', '${p.id}', this.value)">
          <option value="">-- Kies ${label} (Open) --</option>
          <optgroup label="Standaard">
            ${SPECIAL_OPTIONS.map(opt => `<option value="${opt}" ${assignedVal === opt ? 'selected' : ''}>${opt}</option>`).join('')}
          </optgroup>
          <optgroup label="Personen">
            ${state.personen.map(pers => `<option value="${pers.id}" ${String(assignedVal) === String(pers.id) || assignedVal === pers.naam ? 'selected' : ''}>${pers.naam} (${pers.rol || 'vrijwilliger'})</option>`).join('')}
          </optgroup>
        </select>
        ${isC && assignedVal && !SPECIAL_OPTIONS.includes(assignedVal) ? `
          <button class="btn btn-whatsapp btn-sm no-print" onclick="appChauffeurDirect('${r.id}', '${assignedVal}')" title="Stuur WhatsApp ritbericht">馃摬</button>
        ` : ''}
        <button class="btn-remove-slot no-print" onclick="removeSlot('${r.id}', '${p.id}')" title="Verwijder plek">&times;</button>
      </div>
    `;
  });
  return html;
}

// Toggle edit paneel
function toggleEditPanel(routeId) {
  const panel = document.getElementById(`edit-panel-${routeId}`);
  if (panel) {
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }
}

// Opslaan van routenaam, nummer en tijden
async function saveRouteEdits(routeId) {
  const r = state.routes.find(item => String(item.id) === String(routeId));
  if (!r) return;

  const newNr = document.getElementById(`edit-nr-${routeId}`).value.trim();
  const newName = document.getElementById(`edit-name-${routeId}`).value.trim();
  const newPlaats = document.getElementById(`edit-plaats-${routeId}`).value.trim();
  const newVertrek = document.getElementById(`edit-vertrek-${routeId}`).value.trim();
  const newTerug = document.getElementById(`edit-terug-${routeId}`).value.trim();
  const newAanwezig = document.getElementById(`edit-aanwezig-${routeId}`).value.trim();
  const newNotes = document.getElementById(`edit-notes-${routeId}`).value.trim();

  r.nr = newNr;
  r.naam = newName;
  r.plaats = newPlaats;
  r.vertrek = newVertrek;
  r.terug = newTerug;
  r.aanwezig = newAanwezig;
  r.opmerkingen = newNotes;

  // Update Supabase
  try {
    await supabaseClient.from('routes').update({
      nr: newNr,
      naam: newName,
      plaats: newPlaats,
      vertrek: newVertrek,
      terug: newTerug,
      aanwezig: newAanwezig,
      opmerkingen: newNotes
    }).eq('id', routeId);
  } catch(e) { console.log("Supabase update:", e); }

  renderRoutes();
}

// Plek toewijzen
async function assignPersonToSlot(routeId, slotId, val) {
  const r = state.routes.find(item => String(item.id) === String(routeId));
  if (!r || !r.plekken) return;
  const slot = r.plekken.find(p => String(p.id) === String(slotId));
  if (!slot) return;

  if (SPECIAL_OPTIONS.includes(val)) {
    slot.status = val;
    slot.persoon_id = null;
    slot.naam = val;
  } else if (val) {
    slot.status = null;
    slot.persoon_id = val;
    const pObj = state.personen.find(p => String(p.id) === String(val));
    slot.naam = pObj ? pObj.naam : val;
  } else {
    slot.status = null;
    slot.persoon_id = null;
    slot.naam = "";
  }

  // Supabase update
  try {
    await supabaseClient.from('plekken').update({
      persoon_id: slot.persoon_id,
      status: slot.status
    }).eq('id', slotId);
  } catch(e) { console.log(e); }

  renderRoutes();
}

// Plek toevoegen
async function addSlotToRoute(routeId, roleType) {
  const r = state.routes.find(item => String(item.id) === String(routeId));
  if (!r) return;
  if (!r.plekken) r.plekken = [];

  const existingCount = r.plekken.filter(p => (p.rol_label || p.rol || '').startsWith(roleType)).length;
  const newLabel = roleType === 'S' && existingCount === 0 ? 'S' : `${roleType}${existingCount + 1}`;
  const newSlot = {
    id: 'local_' + Date.now(),
    route_id: routeId,
    rol: roleType,
    rol_label: newLabel,
    status: null,
    persoon_id: null
  };

  r.plekken.push(newSlot);

  try {
    const { data } = await supabaseClient.from('plekken').insert({
      route_id: routeId,
      rol: roleType,
      rol_label: newLabel
    }).select().single();
    if (data) newSlot.id = data.id;
  } catch(e) { console.log(e); }

  renderRoutes();
}

// Plek verwijderen
async function removeSlot(routeId, slotId) {
  const r = state.routes.find(item => String(item.id) === String(routeId));
  if (!r || !r.plekken) return;
  r.plekken = r.plekken.filter(p => String(p.id) !== String(slotId));

  try {
    await supabaseClient.from('plekken').delete().eq('id', slotId);
  } catch(e) { console.log(e); }

  renderRoutes();
}

// WhatsApp direct sturen
function appChauffeurDirect(routeId, persIdOrName) {
  const r = state.routes.find(item => String(item.id) === String(routeId));
  if (!r) return;

  const pers = state.personen.find(p => String(p.id) === String(persIdOrName) || p.naam === persIdOrName);
  const driverName = pers ? pers.naam : persIdOrName;
  const phone = pers ? pers.telefoon : "";

  let msg = `Beste ${driverName},\n\nHierbij je ritplanning voor FC Berghuizen Sintactie:\n\n`;
  msg += `馃殫 *Route:* ${r.nr ? '#' + r.nr + ' ' : ''}${r.naam}\n`;
  msg += `馃搷 *Plaats:* ${r.plaats || 'Oldenzaal'}\n`;
  msg += `鈴?*Aanwezig:* ${r.aanwezig || 'volgens afspraak'}\n`;
  msg += `鈴?*Vertrek:* ${r.vertrek || '?'} (Terug: ${r.terug || '?'})\n`;
  if (r.opmerkingen) msg += `鈩癸笍 *Notitie:* ${r.opmerkingen}\n`;
  msg += `\nSucces en bedankt voor het rijden! 馃巺鈿絗;

  let cleanPhone = (phone || "").replace(/[^0-9]/g, "");
  if (cleanPhone.startsWith("06")) cleanPhone = "316" + cleanPhone.substring(2);

  if (!cleanPhone) {
    const ask = prompt(`Geen telefoonnummer voor ${driverName}. Vul mobiel nummer in (bijv. 0612345678):`);
    if (ask) cleanPhone = ask.replace(/[^0-9]/g, "").replace(/^06/, "316");
    else return;
  }

  window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

      aanwezig: newR.aanwezig,

}

async function deleteRoute(routeId) {
  if (confirm("Weet je zeker dat je deze route wilt verwijderen?")) {
    state.routes = state.routes.filter(r => String(r.id) !== String(routeId));
    renderRoutes();
    try {
      await supabaseClient.from('routes').delete().eq('id', routeId);
    } catch(e) { console.log(e); }
  }
}
